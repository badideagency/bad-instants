<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>MyInstants</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <form id="searchForm" class="search" autocomplete="off" role="search">
      <i data-icon="search" data-size="14"></i>
      <input id="searchInput" type="text" placeholder="Ses ara" aria-label="Ses ara (Enter)" spellcheck="false">
      <button id="searchClear" type="button" class="icon-btn clear" title="Aramayı temizle" aria-label="Aramayı temizle" hidden><i data-icon="x" data-size="14"></i></button>
    </form>
    <button id="refreshBtn" type="button" class="icon-btn bordered" title="Yenile (listeyi siteden tekrar çeker)" aria-label="Listeyi yenile"><i data-icon="refresh-cw" data-size="14"></i></button>
  </header>

  <div class="controls">
    <div id="region" class="seg" role="group" aria-label="Bölge">
      <button type="button" data-region="tr">TR</button>
      <button type="button" data-region="us">Global (US)</button>
    </div>
    <label class="volume" title="Önizleme ses seviyesi">
      <i data-icon="volume-2" data-size="14"></i>
      <input id="volume" type="range" min="0" max="100" step="1" value="60" aria-label="Önizleme ses seviyesi">
      <span id="volumeLabel" class="pct">%60</span>
    </label>
  </div>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Listeler">
    <button type="button" role="tab" data-tab="trending">Trending</button>
    <button type="button" role="tab" data-tab="best">Hall of Fame</button>
    <button type="button" role="tab" data-tab="recent">Just Added</button>
    <button type="button" role="tab" data-tab="category">Kategoriler</button>
  </nav>

  <div id="categoryBar" class="subbar" hidden>
    <div class="select">
      <select id="categorySelect" aria-label="Kategori"></select>
      <i data-icon="chevron-down" data-size="14"></i>
    </div>
  </div>
  <div id="searchBar" class="subbar" hidden>
    <span id="searchLabel" class="search-label"></span>
    <button id="searchExit" type="button" class="link-btn">Aramadan çık</button>
  </div>

  <div id="notice" class="notice" role="status" hidden></div>

  <main id="list" class="list">
    <div id="rows" role="list"></div>
    <div id="listEnd" class="list-end"></div>
  </main>

  <footer class="status">
    <span id="statusText"></span>
    <button id="updateChip" type="button" class="update-chip" hidden></button>
    <button id="hostText" type="button" class="host"></button>
  </footer>

  <script src="js/CSInterface.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/siteScraper.js"></script>
  <script src="js/localFiles.js"></script>
  <script src="js/vendor/fflate.js"></script>
  <script src="js/updater.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
